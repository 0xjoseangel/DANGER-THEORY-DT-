name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build HTML
        working-directory: book
        env:
          BASE_URL: /DANGER-THEORY-DT-
        run: myst build --html

      - name: Debug - List build output
        run: |
          echo "=== Contenido de book/_build ==="
          ls -la book/_build/ || echo "No existe book/_build"
          echo "=== Contenido de book/_build/html ==="
          ls -la book/_build/html/ || echo "No existe book/_build/html"
          echo "=== Contenido de book/_build/site ==="
          ls -la book/_build/site/ || echo "No existe book/_build/site"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
