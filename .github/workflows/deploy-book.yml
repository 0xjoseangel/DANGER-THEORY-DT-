name: deploy-book

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # 1. Instalamos las librerías de Python (NumPy, Pandas, etc.)
      # Necesario si tus notebooks ejecutan código Python
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          auto-activate-base: false
          activate-environment: computing-in-context

      # 2. Instalamos Node.js (Necesario para el nuevo motor MyST)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalamos la herramienta MyST CLI
      - name: Install MyST
        run: npm install -g myst

      # 4. Construimos el libro usando el comando 'myst' (NO jupyter-book)
      - name: Build the book
        run: |
          myst build --html

      # 5. Subimos el artefacto (MyST usa '_build/site', así que esto ahora SÍ es correcto)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4