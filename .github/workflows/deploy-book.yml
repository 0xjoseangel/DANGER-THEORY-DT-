name: deploy-book

# Se ejecuta solo cuando haces push a la rama main
on:
  push:
    branches:
      - main
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    # Instala dependencias
    - name: Install dependencies
      run: |
        pip install -U pip
        pip install jupyter-book
        # ¡IMPORTANTE! Instala las librerías de tu TFM si tienes un requirements.txt
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Si no tienes requirements.txt, descomenta la siguiente línea:
        # pip install pandas numpy matplotlib seaborn deap openpyxl

    # Construye el libro
    - name: Build the book
      run: |
        jupyter-book build .

    # Empuja la carpeta construida a la rama gh-pages
    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # CORRECCIÓN AQUÍ: Apuntamos a la nueva carpeta de salida
        publish_dir: ./_build/site